[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2hl"
version = "0.2.0"
description = "Local CS2 demo highlight generator: detects multikills, aces and clutches and exports 16:9 and 9:16 clips."
requires-python = ">=3.11"
dependencies = ["demoparser2==0.42.0", "pandas>=2", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.8"]

[project.scripts]
cs2hl = "cs2hl.cli:main"
cs2hl-gui = "cs2hl.gui.app:main"

[tool.setuptools.packages.find]
include = ["cs2hl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
